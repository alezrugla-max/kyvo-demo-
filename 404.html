<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07070B">
<title>Kyvo przeniósł się → kyvo-app.github.io</title>
<link rel="canonical" href="https://kyvo-app.github.io/">
<noscript><meta http-equiv="refresh" content="0; url=https://kyvo-app.github.io/"></noscript>
<style>
  html,body{margin:0;height:100%;background:#07070B;color:#F4F4F8;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;text-align:center;gap:14px}
  h1{font-size:22px;margin:0}
  p{margin:0;max-width:420px;color:#C9C9D6}
  a.btn{display:inline-block;margin-top:6px;padding:13px 22px;border-radius:14px;background:#7C5CFF;color:#fff;text-decoration:none;font-weight:700}
  small{color:#8A8A99}
</style>
</head>
<body>
<main>
  <h1>Kyvo przeniósł się 🚀</h1>
  <p><b>Kyvo przeniósł się — dodaj apkę ponownie do ekranu głównego i włącz powiadomienia.</b></p>
  <p>Nowy adres: <b>kyvo-app.github.io</b></p>
  <p><small id="how"></small></p>
  <a class="btn" id="go" href="https://kyvo-app.github.io/">Otwórz nową Kyvo</a>
  <p><small id="auto"></small></p>
</main>
<script>
/* Kyvo v8.25 redirect stub for the OLD address alezrugla-max.github.io/kyvo-demo-/ .
   Same path + query + hash on the new home (e.g. /kyvo-demo-/#coin/solana%3A... -> https://kyvo-app.github.io/#coin/solana%3A...).
   No tracking, no storage, no cookies. */
(function () {
  var NEW = 'https://kyvo-app.github.io';
  var p = location.pathname.replace(/^\/kyvo-demo-(?=\/|$)/, '') || '/';
  if (/^\/(index|404)\.html$/.test(p)) p = '/';
  var target = NEW + p + location.search + location.hash;
  document.getElementById('go').href = target;
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  document.getElementById('how').textContent = ios
    ? 'iPhone: otwórz nowy adres w Safari → Udostępnij → „Do ekranu początkowego”, potem w Kyvo włącz powiadomienia. Starą ikonę możesz usunąć.'
    : 'Android/komputer: otwórz nowy adres → menu przeglądarki → „Zainstaluj aplikację”, potem w Kyvo włącz powiadomienia. Starą ikonę możesz usunąć.';
  // Unregister any old Kyvo / OneSignal service worker still installed for the old address.
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
    if (window.caches && caches.keys) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
  } catch (e) {}
  // Installed old icon: give time to read the note; a normal browser tab moves on quickly.
  var wait = standalone ? 8 : 3;
  var el = document.getElementById('auto');
  (function tick() {
    el.textContent = 'Przenoszę za ' + wait + ' s…';
    if (wait-- <= 0) { location.replace(target); return; }
    setTimeout(tick, 1000);
  })();
})();
</script>
</body>
</html>
